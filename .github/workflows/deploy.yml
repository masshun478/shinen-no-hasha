name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
      - "scripts/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Worker syntax
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("worker.js","utf8").replace(/^export default/, "const __worker ="); new Function(s); console.log("Worker syntax OK");'
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify the live Worker serves this exact build
        shell: bash
        run: |
          set -euo pipefail
          url="https://mute-tree-13ba.masshun.workers.dev/?build=v65-20261129"
          for attempt in 1 2 3 4 5; do
            if curl --connect-timeout 10 --max-time 30 -fsS -D /tmp/worker-headers "$url" -o /tmp/worker-body; then
              break
            fi
            sleep 3
          done
          echo "=== LIVE RESPONSE HEADERS ==="
          cat /tmp/worker-headers
          echo "=== LIVE RESPONSE BODY (first 2000 bytes) ==="
          head -c 2000 /tmp/worker-body
          echo
          grep -F 'data-game-build="v65-20261129"' /tmp/worker-body
          grep -i '^x-game-build: v65-20261129' /tmp/worker-headers
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --with-deps
      - name: Run mobile browser interaction test
        env:
          GAME_URL: https://mute-tree-13ba.masshun.workers.dev/?smoke=v65
        run: node scripts/live-smoke.mjs
